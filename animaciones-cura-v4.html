<div class="cw" id="cw">
  <canvas id="mc"></canvas>
  <div class="ov"><div class="ol" id="ol">ANIMACIÓN 01</div><div class="ot" id="ot">Argentina que Despierta</div></div>
  <div class="tbdg tbg" id="tbdg">TIPO 1 · GEOGRÁFICO</div>
  <div class="hint" id="hint">Hover sobre el mapa para interactuar</div>
  <div id="tip"><div class="tn2" id="tn2">–</div><div class="ts" id="ts">–</div></div>
</div>
</div>
<script>

/* ═══ MAPA ARGENTINA — CONTORNO GEOGRÁFICO REAL ═══
   ~115 puntos normalizados basados en datos geográficos
   del territorio argentino. x=lon oeste→este, y=lat norte→sur
   Aspect ratio real: ~20°lon x 33°lat = 1:2.1
*/
const AR_RATIO=1/2.1;

/* ═══ GEOJSON — cargado desde ./data/provincias.geojson ═══
   Fuente oficial: infra.datos.gob.ar/georef-dev/provincias.geojson
   El archivo debe estar en /data/provincias.geojson junto al HTML.
   Proyección: lon/lat → coordenadas normalizadas (0-1) → canvas via txy().
   El bounding box se calcula dinámicamente desde los datos reales.
*/
let GEO_PATHS  = [];   // [{nx,ny}...] por cada ring de cada provincia
let GEO_READY  = false;
let GEO_ERROR  = null;
let GEO_BBOX   = {lonMin:-73.58,lonMax:-53.57,latMin:-55.06,latMax:-21.78};

function geoNorm(lon,lat){
  const nx=(lon-GEO_BBOX.lonMin)/(GEO_BBOX.lonMax-GEO_BBOX.lonMin);
  const ny=(GEO_BBOX.latMax-lat)/(GEO_BBOX.latMax-GEO_BBOX.latMin);
  return{nx,ny};
}

function parseGeoJSON(gj){
  // Compute actual bounding box from data
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const f of gj.features){
    const geom=f.geometry;
    const polys=geom.type==='MultiPolygon'?geom.coordinates:
                geom.type==='Polygon'?[geom.coordinates]:[];
    for(const poly of polys)
      for(const ring of poly)
        for(const [lon,lat] of ring){
          if(lon<x0)x0=lon;if(lon>x1)x1=lon;
          if(lat<y0)y0=lat;if(lat>y1)y1=lat;
        }
  }
  GEO_BBOX={lonMin:x0,lonMax:x1,latMin:y0,latMax:y1};

  // Build normalized path arrays
  GEO_PATHS=[];
  for(const f of gj.features){
    const geom=f.geometry;
    const polys=geom.type==='MultiPolygon'?geom.coordinates:
                geom.type==='Polygon'?[geom.coordinates]:[];
    for(const poly of polys){
      // Only outer ring (index 0); skip holes
      const ring=poly[0];
      GEO_PATHS.push(ring.map(([lon,lat])=>geoNorm(lon,lat)));
    }
  }
  GEO_READY=true;
}

fetch('./data/provincias.geojson')
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(parseGeoJSON)
  .catch(e=>{GEO_ERROR='No se pudo cargar ./data/provincias.geojson\n'+e.message;});


const NODES=[
  {id:'caba',name:'Buenos Aires',short:'CABA',x:0.800,y:0.482,s:5.5},
  {id:'ros', name:'Rosario',     short:'ROS', x:0.682,y:0.332,s:3.5},
  {id:'cba', name:'Córdoba',     short:'CBA', x:0.510,y:0.288,s:4},
  {id:'mza', name:'Mendoza',     short:'MZA', x:0.265,y:0.332,s:3.5},
  {id:'tuc', name:'Tucumán',     short:'TUC', x:0.440,y:0.148,s:3},
  {id:'sal', name:'Salta',       short:'SAL', x:0.412,y:0.085,s:2.5},
  {id:'juj', name:'Jujuy',       short:'JUJ', x:0.398,y:0.038,s:2},
  {id:'for', name:'Formosa',     short:'FOR', x:0.645,y:0.118,s:2},
  {id:'cha', name:'Resistencia', short:'CHA', x:0.658,y:0.155,s:2.5},
  {id:'cor', name:'Corrientes',  short:'COR', x:0.700,y:0.215,s:2.5},
  {id:'mis', name:'Misiones',    short:'MIS', x:0.848,y:0.210,s:2},
  {id:'cat', name:'Catamarca',   short:'CAT', x:0.402,y:0.210,s:2},
  {id:'lri', name:'La Rioja',    short:'LRI', x:0.350,y:0.268,s:2},
  {id:'ste', name:'Sgo. del Estero',short:'SGO',x:0.545,y:0.210,s:2.5},
  {id:'eri', name:'Entre Ríos',  short:'ERI', x:0.705,y:0.408,s:2.5},
  {id:'sfe', name:'Santa Fe',    short:'SFE', x:0.665,y:0.295,s:3},
  {id:'sju', name:'San Juan',    short:'SJU', x:0.278,y:0.298,s:2},
  {id:'slu', name:'San Luis',    short:'SLU', x:0.395,y:0.378,s:2},
  {id:'neu', name:'Neuquén',     short:'NEU', x:0.225,y:0.522,s:2.5},
  {id:'lpa', name:'La Pampa',    short:'LPA', x:0.475,y:0.465,s:2},
  {id:'bbl', name:'Bahía Blanca',short:'BBA', x:0.600,y:0.518,s:3},
  {id:'rne', name:'Río Negro',   short:'RNE', x:0.358,y:0.580,s:2},
  {id:'chu', name:'Chubut',      short:'CHU', x:0.395,y:0.668,s:2},
  {id:'scr', name:'Santa Cruz',  short:'SCR', x:0.340,y:0.822,s:2},
  {id:'tdf', name:'T. del Fuego',short:'TDF', x:0.318,y:0.962,s:2},
];
const CONNS=[
  ['caba','ros'],['caba','eri'],['caba','bbl'],['caba','sfe'],
  ['ros','cba'],['ros','sfe'],['ros','eri'],
  ['cba','tuc'],['cba','lri'],['cba','slu'],['cba','ste'],
  ['mza','sju'],['mza','neu'],['mza','slu'],['mza','lri'],
  ['tuc','sal'],['tuc','ste'],['tuc','cat'],
  ['sal','juj'],['sal','cat'],
  ['for','cha'],['cha','cor'],['cor','mis'],['cha','ste'],
  ['ste','cat'],['sfe','eri'],['sfe','ste'],
  ['bbl','lpa'],['bbl','rne'],['rne','neu'],['rne','chu'],
  ['chu','scr'],['scr','tdf'],['neu','lpa'],['slu','lpa'],
  ['eri','cor'],['caba','lpa'],
];

/* ═══ CANVAS ═══ */
const canvas=document.getElementById('mc');
const ctx=canvas.getContext('2d');
let W=0,H=0,dpr=window.devicePixelRatio||1;
let mx=-9,my=-9;

function resize(){
  const a=document.getElementById('cw');
  W=a.clientWidth;H=a.clientHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  if(CA){CA.s={};CA.init(CA.s);}
}
window.addEventListener('resize',resize);

/* ═══ MAP HELPERS ═══ */
function mp(){
  const px=W*.06,py=H*.05,aw=W-2*px,ah=H-2*py;
  let mw=aw,mh=aw/AR_RATIO;
  if(mh>ah){mh=ah;mw=ah*AR_RATIO;}
  return{ox:px+(aw-mw)/2,oy:py+(ah-mh)/2,mw,mh};
}
function txy(nx,ny){const{ox,oy,mw,mh}=mp();return{x:ox+nx*mw,y:oy+ny*mh};}
function npos(n){return txy(n.x,n.y);}
function gn(id){return NODES.find(n=>n.id===id);}
function lerp(a,b,t){return a+(b-a)*t;}
function eio(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

function drawMap(fa,sa,ga,prog){
  fa=fa||.05;sa=sa||.45;ga=ga||.12;prog=prog===undefined?1:prog;
  if(!GEO_READY){
    // Muestra estado mientras carga
    ctx.save();
    ctx.font='700 11px JetBrains Mono,monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(GEO_ERROR){
      ctx.fillStyle='rgba(255,80,80,.7)';
      GEO_ERROR.split('\n').forEach((l,i)=>ctx.fillText(l,W/2,H/2-10+i*16));
    } else {
      ctx.fillStyle='rgba(0,194,255,.35)';
      ctx.fillText('Cargando mapa…',W/2,H/2);
    }
    ctx.restore();
    return;
  }
  // Revelado progresivo: muestra provincias de a una (para animación "despertar")
  const total=GEO_PATHS.length;
  const show=prog>=1?total:Math.max(0,Math.floor(total*prog));
  ctx.save();
  // Primero fill de todos los rings visibles
  ctx.fillStyle='rgba(0,78,133,'+fa+')';
  for(let i=0;i<show;i++){
    const path=GEO_PATHS[i];if(path.length<2)continue;
    const p0=txy(path[0].nx,path[0].ny);
    ctx.beginPath();ctx.moveTo(p0.x,p0.y);
    for(let j=1;j<path.length;j++){const p=txy(path[j].nx,path[j].ny);ctx.lineTo(p.x,p.y);}
    ctx.closePath();ctx.fill();
  }
  // Luego stroke (con glow) de todos los rings visibles
  ctx.shadowColor='rgba(0,194,255,'+ga+')';ctx.shadowBlur=14;
  ctx.strokeStyle='rgba(0,194,255,'+sa+')';ctx.lineWidth=1.2;
  for(let i=0;i<show;i++){
    const path=GEO_PATHS[i];if(path.length<2)continue;
    const p0=txy(path[0].nx,path[0].ny);
    ctx.beginPath();ctx.moveTo(p0.x,p0.y);
    for(let j=1;j<path.length;j++){const p=txy(path[j].nx,path[j].ny);ctx.lineTo(p.x,p.y);}
    ctx.closePath();ctx.stroke();
  }
  ctx.shadowBlur=0;ctx.restore();
}

function drawN(n,opts){
  const{r=n.s*1.4,col='#00C2FF',al=1,glow=.4,lbl=false,pulse=0}=opts||{};
  const p=npos(n);ctx.save();
  if(glow>0){
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3.5);
    g.addColorStop(0,'rgba(0,194,255,'+(glow*al)+')');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*3.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=al;ctx.shadowColor='rgba(0,194,255,.6)';ctx.shadowBlur=6;
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  if(pulse>0){ctx.beginPath();ctx.arc(p.x,p.y,r+pulse*12,0,Math.PI*2);ctx.strokeStyle='rgba(0,194,255,'+(1-pulse)*.4+')';ctx.lineWidth=1;ctx.stroke();}
  ctx.globalAlpha=1;
  if(lbl){ctx.font='600 '+Math.max(8,n.s*1.6)+'px Space Grotesk,sans-serif';ctx.fillStyle='rgba(232,244,255,'+(al*.82)+')';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(n.short,p.x,p.y+r+3);}
  ctx.restore();
}

function drawConn(n1,n2,al,col){
  const p1=npos(n1),p2=npos(n2);ctx.save();
  ctx.strokeStyle=col||'rgba(0,194,255,'+(al||.15)+')';ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();ctx.restore();
}

function pkt(sx,sy,ex,ey,spd,col){
  return{x:sx,y:sy,sx,sy,ex,ey,t:0,spd:spd||(0.005+Math.random()*.005),
    col:col||'rgba(0,194,255,'+(0.7+Math.random()*.3)+')',
    sz:1.5+Math.random(),tr:[],done:false};
}
function tickP(p){
  p.tr.push({x:p.x,y:p.y});if(p.tr.length>14)p.tr.shift();
  p.t+=p.spd;const et=eio(Math.min(1,p.t));
  p.x=lerp(p.sx,p.ex,et);p.y=lerp(p.sy,p.ey,et);
  if(p.t>=1)p.done=true;
}
function drawP(p){
  ctx.save();
  for(let i=0;i<p.tr.length;i++){
    const a=(i/p.tr.length)*.45;
    ctx.fillStyle=p.col.replace(/[\d.]+\)$/,a+')');
    ctx.beginPath();ctx.arc(p.tr[i].x,p.tr[i].y,(i/p.tr.length)*p.sz,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowColor=p.col;ctx.shadowBlur=7;
  ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.restore();
}

/* ═══════════════════════════════════════════
   ANIMACIONES
═══════════════════════════════════════════ */
const ANIMS=[];

/* ── 01 ARGENTINA QUE DESPIERTA ── */
ANIMS.push({
  name:'Argentina que Despierta',ns:'ANIMACIÓN 01',type:'geo',
  hint:'El país emerge de la oscuridad hacia la red sanitaria',s:{},
  init(s){s.ph=0;s.out=0;s.nA=NODES.map(()=>0);s.cR=0;s.br=0;s.pk=[];s.st=null;},
  update(s,dt){
    s.br+=dt;
    if(s.ph===0){s.out=Math.min(1,s.out+dt*.32);if(s.out>=1)s.ph=1;}
    else if(s.ph===1){
      const ni=Math.floor(s.br/.25);
      for(let i=0;i<Math.min(ni,NODES.length);i++)s.nA[i]=Math.min(1,s.nA[i]+dt*2.5);
      if(ni>=NODES.length)s.ph=2;
    }else if(s.ph===2){s.cR=Math.min(1,s.cR+dt*.55);if(s.cR>=1)s.ph=3;}
    if(s.ph>=2&&Math.random()<.05){
      const c=CONNS[Math.floor(Math.random()*CONNS.length)];
      const n1=gn(c[0]),n2=gn(c[1]);
      if(n1&&n2){const p1=npos(n1),p2=npos(n2);s.pk.push(pkt(p1.x,p1.y,p2.x,p2.y));}
    }
    s.pk.forEach(p=>tickP(p));s.pk=s.pk.filter(p=>!p.done);
    if(s.pk.length>30)s.pk.splice(0,5);
  },
  draw(s){

ANIMS.push({

    for(let col=0;col<cols;col++)
      for(let row=0;row<rows;row++){
        const xOff=row%2===0?0:size*.866;
        const cx=col*size*1.732+xOff+size*.5,cy=row*size*1.5+size*.5;
        if(cx<W+size&&cy<H+size)
          s.hexes.push({cx,cy,sz:size*.9,ph:Math.random()*Math.PI*2,spd:.4+Math.random()*.6,on:Math.random()<.3});
      }
  },
  update(s,dt){

    s.waves.forEach(w=>{w.r+=dt*200;if(w.r>Math.max(W,H)*.7)w.done=true;});
    s.waves=s.waves.filter(w=>!w.done);
    s.hexes.forEach(h=>{
      const lit=s.waves.some(w=>Math.abs(Math.hypot(h.cx-w.x,h.cy-w.y)-w.r)<30);

      ctx.fillStyle=l.col+'.9)';ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText(l.lbl,W*.105,l.y+s.lh*.38);
      ctx.font='400 '+Math.min(10,s.lh*.22)+'px JetBrains Mono,monospace';
      ctx.fillStyle='rgba(232,244,255,.38)';ctx.fillText(l.sub,W*.105,l.y+s.lh*.65);
      ctx.font='700 '+Math.min(9,s.lh*.2)+'px JetBrains Mono,monospace';
      ctx.fillStyle=l.col+'.3)';ctx.textAlign='right';ctx.fillText('L'+(i+1),W*.90,l.y+s.lh*.5);
      ctx.restore();
    });
    for(let i=0;i<s.layers.length-1;i++){
      const y1=s.layers[i].y+s.lh-2,y2=s.layers[i+1].y+2;
      ctx.save();ctx.setLineDash([2,3]);ctx.strokeStyle='rgba(0,194,255,.18)';ctx.lineWidth=.8;
      ctx.beginPath();ctx.moveTo(W*.5,y1);ctx.lineTo(W*.5,y2);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    }
    s.pk.forEach(p=>drawP(p));
  }
});

/* ── 09 PARTÍCULAS DE INFORMACIÓN ── */
ANIMS.push({
  name:'Partículas de Información',ns:'ANIMACIÓN 09',type:'data',
  hint:'Miles de partículas formando la red sanitaria nacional',s:{},
  init(s){
    s.t=0;s.atTimer=0;s.ats=[];
    s.parts=Array.from({length:500},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.8,
      r:.5+Math.random()*1.5,al:.2+Math.random()*.6,
      col:Math.random()<.6?'0,194,255':'0,255,168',ph:Math.random()*Math.PI*2,
    }));
  },
  update(s,dt){
    s.t+=dt;s.atTimer+=dt;
    if(s.atTimer>5){
      s.atTimer=0;
      s.ats=Array.from({length:4},()=>({x:W*.2+Math.random()*W*.6,y:H*.2+Math.random()*H*.6,str:900+Math.random()*700,life:4}));
    }
    s.ats.forEach(a=>{a.life-=dt;});s.ats=s.ats.filter(a=>a.life>0);
    s.parts.forEach(p=>{
      s.ats.forEach(a=>{
        const dx=a.x-p.x,dy=a.y-p.y,dist=Math.hypot(dx,dy);
        if(dist>5&&dist<250){const f=a.str/(dist*dist)*Math.min(1,a.life);p.vx+=dx/dist*f*dt;p.vy+=dy/dist*f*dt;}
      });
      p.vx*=.98;p.vy*=.98;p.x+=p.vx;p.y+=p.vy;
      p.al=.3+.3*Math.sin(s.t*1.5+p.ph);
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    });
  },
  draw(s){
    ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(0,12,24,.96)';ctx.fillRect(0,0,W,H);
    ctx.save();
    const step=8;
    for(let i=0;i<s.parts.length;i+=step)
      for(let j=i+step;j<Math.min(i+80,s.parts.length);j+=step){
        const a=s.parts[i],b=s.parts[j];const d=Math.hypot(b.x-a.x,b.y-a.y);
        if(d<60){ctx.strokeStyle='rgba(0,194,255,'+(1-d/60)*.07+')';ctx.lineWidth=.4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
      }
    ctx.restore();
    s.parts.forEach(p=>{ctx.fillStyle='rgba('+p.col+','+p.al+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
    s.ats.forEach(a=>{
      const lR=a.life/4;ctx.save();
      const g=ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,80);
      g.addColorStop(0,'rgba(0,194,255,'+lR*.13+')');g.addColorStop(1,'transparent');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(a.x,a.y,80,0,Math.PI*2);ctx.fill();ctx.restore();
    });
  }
});

/* ── 10 DATA STREAM ── */
ANIMS.push({
  name:'Data Stream',ns:'ANIMACIÓN 10',type:'data',
  hint:'Registros clínicos del sistema C.U.R.A. fluyendo en tiempo real',s:{},
  init(s){
    s.t=0;
    const chars='0123456789ABCDEF:T+-#';
    const recs=['CURA-','DNI:','HC-','RX:','ICD:','LAB-'];
    const numCols=Math.floor(W/22);
    s.cols=Array.from({length:numCols},()=>({
      x:0,y:-Math.random()*H,spd:65+Math.random()*115,
      ch:Array.from({length:Math.ceil(H/15)+2},()=>Math.random()<.2?recs[Math.floor(Math.random()*recs.length)]:chars[Math.floor(Math.random()*chars.length)]),
      col:Math.random()<.15?'0,255,168':'0,194,255',
      al:.3+Math.random()*.5,uTimer:0,uInt:.08+Math.random()*.2,
    }));
    s.cols.forEach((c,i)=>{c.x=(i+.5)*22;});
  },
  update(s,dt){
    s.t+=dt;
    const chars='0123456789ABCDEF:T+-#';
    s.cols.forEach(col=>{
      col.y+=col.spd*dt;
      if(col.y>H+50)col.y=-H*.15-Math.random()*H*.3;
      col.uTimer+=dt;
      if(col.uTimer>col.uInt){
        col.uTimer=0;
        const idx=Math.floor(Math.random()*col.ch.length);
        col.ch[idx]=chars[Math.floor(Math.random()*chars.length)];
      }
    });
  },
  draw(s){
    ctx.clearRect(0,0,W,H);ctx.fillStyle='rgba(0,12,24,.97)';ctx.fillRect(0,0,W,H);
    s.cols.forEach(col=>{
      col.ch.forEach((ch,i)=>{
        const cy=col.y-i*15;if(cy<-15||cy>H+5)return;
        const fade=Math.max(0,1-i/20),isHead=i===0;
        ctx.save();
        ctx.font=(isHead?'700':'400')+' 11px JetBrains Mono,monospace';
        if(isHead){ctx.fillStyle='rgba(230,255,255,'+(fade*col.al+.3)+')';ctx.shadowColor='rgba('+col.col+',.8)';ctx.shadowBlur=8;}
        else ctx.fillStyle='rgba('+col.col+','+fade*col.al*.7+')';
        ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(ch,col.x,cy);
        ctx.shadowBlur=0;ctx.restore();
      });
    });
    const labels=['▶ PROCESANDO REGISTROS CLÍNICOS','▶ VERIFICANDO IDENTIDAD C.U.R.A.','▶ SINCRONIZANDO CON PAMI','▶ VALIDANDO PRESCRIPCIONES'];
    const lbl=labels[Math.floor(s.t*.4)%labels.length];
    ctx.save();ctx.font='700 '+Math.min(13,W*.016)+'px JetBrains Mono,monospace';
    ctx.fillStyle='rgba(0,255,168,.5)';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(lbl,W/2,H-18);ctx.restore();
  }
});

/* ═══ CONTROLLER ═══ */
let CA=null,curIdx=0,lastT=0,raf=null;
const TBDG={geo:{txt:'TIPO 1 · GEOGRÁFICO',cls:'tbdg tbg'},net:{txt:'TIPO 2 · RED TECNOLÓGICA',cls:'tbdg tbn'},data:{txt:'TIPO 3 · DATOS / INTEROP.',cls:'tbdg tbd'}};

function go(idx){
  if(raf)cancelAnimationFrame(raf);
  curIdx=idx;CA=ANIMS[idx];CA.s={};CA.init(CA.s);
  document.querySelectorAll('.ab').forEach((b,i)=>b.classList.toggle('on',i===idx));
  document.getElementById('ol').textContent=CA.ns;
  document.getElementById('ot').textContent=CA.name;
  document.getElementById('hnum').textContent=CA.ns;
  document.getElementById('hname').textContent=CA.name;
  document.getElementById('hint').textContent=CA.hint;
  const b=document.getElementById('tbdg');
  const info=TBDG[CA.type];b.textContent=info.txt;b.className=info.cls;
  lastT=performance.now();loop(lastT);
}

function loop(now){
  const dt=Math.min((now-lastT)/1000,.05);lastT=now;
  if(CA){CA.update(CA.s,dt);CA.draw(CA.s);}
  raf=requestAnimationFrame(loop);
}

/* Tooltip */
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;
  if(CA&&CA.type==='geo'){
    let found=null;
    NODES.forEach(n=>{const p=npos(n);if(Math.hypot(p.x-mx,p.y-my)<n.s*2.5)found=n;});
    const tip=document.getElementById('tip');
    if(found){
      document.getElementById('tn2').textContent=found.name;
      document.getElementById('ts').textContent='NODO · '+found.short;
      tip.style.display='block';tip.style.left=(mx+12)+'px';tip.style.top=(my-10)+'px';
    }else tip.style.display='none';
  }else document.getElementById('tip').style.display='none';
});
canvas.addEventListener('mouseleave',()=>{document.getElementById('tip').style.display='none';});

window.addEventListener('load',()=>{resize();go(0);});

</script>
