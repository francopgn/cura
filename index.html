<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investigación Léxica - con ubicación real (Georef API)</title>
<style>
body{
    font-family:Arial;
    background:#0b1b34;
    color:white;
    text-align:center;
}
.container{max-width:700px;margin:auto;}
.word{font-size:60px;margin:40px;font-weight:bold;}
button{
    padding:18px;
    margin:10px;
    font-size:22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}
.bigBtn{
    width:40%;
    font-size:26px;
}
.hidden{display:none;}
canvas{background:transparent;margin-top:20px;border-radius:10px; max-width:100%; height:auto;}
input,select{
    padding:12px;
    margin:6px;
    width:85%;
    border-radius:8px;
    border:none;
}
.results-card {
    background: rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 15px;
    margin: 15px 0;
    text-align: left;
}
.warning {
    background: #ff4d4d33;
    border-left: 5px solid #ff4d4d;
    padding: 10px;
    margin: 10px 0;
}
.good {
    background: #4cc9f033;
    border-left: 5px solid #4cc9f0;
}
.error-msg {
    color: #ff9999;
    background: #660000;
    padding: 10px;
    border-radius: 8px;
    margin: 10px auto;
    display: inline-block;
}
</style>
</head>
<body>
<div class="container">

<!-- INSTRUCTIVO -->
<div id="intro">
<h2>Investigación: Reconocimiento de Palabras</h2>
<p><b>Estudiamos cómo se reconocen y procesan las palabras.</b></p>
<p>La tarea te llevará aproximadamente 15 minutos.
Deberás indicar si las palabras presentadas existen en español.</p>
<p>Ejemplo:<br>“TOLIO” → NO<br>“BARRIO” → SÍ</p>
<p>PC: presionar <b>S</b> o <b>N</b><br>Celular: usar botones</p>
<button onclick="goForm()">Continuar</button>
</div>

<!-- FORM -->
<div id="form" class="hidden">
<input id="nombre" placeholder="Nombre" autocomplete="off"><br>
<input id="apellido" placeholder="Apellido" autocomplete="off"><br>
<input id="edad" type="number" inputmode="numeric" placeholder="Edad" min="1" max="120"><br>
<select id="genero">
<option value="">Género</option>
<option>Masculino</option>
<option>Femenino</option>
<option>Otro</option>
</select>
<select id="educacion">
<option value="">Nivel educativo</option>
<option>Primario incompleto</option><option>Primario completo</option>
<option>Secundario incompleto</option><option>Secundario completo</option>
<option>Terciario/universitario incompleto</option><option>Terciario/universitario completo</option>
</select>

<!-- Provincias y Ciudades (cargadas dinámicamente desde Georef API) -->
<select id="provincia" onchange="cargarCiudades()">
    <option value="">Cargando provincias...</option>
</select>
<select id="ciudad" disabled>
    <option value="">Primero elegí una provincia</option>
</select>

<div id="form-error" class="error-msg" style="display:none;"></div>
<button onclick="validateAndStart()">Comenzar</button>
</div>

<div id="countdown" class="hidden word"></div>

<!-- TEST -->
<div id="test" class="hidden">
<div id="word" class="word"></div>
<div id="mobileBtns" class="hidden">
<button class="bigBtn" onclick="answer(true)">SÍ</button>
<button class="bigBtn" onclick="answer(false)">NO</button>
</div>
</div>

<!-- RESULTADOS -->
<div id="results" class="hidden"></div>

</div>

<script>
// ============================================================
// 1. CARGA DE PROVINCIAS Y CIUDADES CON GEOREF API
// ============================================================
async function cargarProvincias() {
    const selectProv = document.getElementById('provincia');
    selectProv.innerHTML = '<option value="">Cargando provincias...</option>';
    try {
        const res = await fetch('https://apis.datos.gob.ar/georef/api/provincias?campos=nombre');
        const data = await res.json();
        const provincias = data.provincias.map(p => p.nombre).sort((a,b)=>a.localeCompare(b,'es'));
        selectProv.innerHTML = '<option value="">Seleccioná una provincia</option>';
        provincias.forEach(prov => {
            const opt = document.createElement('option');
            opt.value = prov;
            opt.textContent = prov;
            selectProv.appendChild(opt);
        });
    } catch(e) {
        console.error('Error cargando provincias:', e);
        selectProv.innerHTML = '<option value="">Error al cargar provincias</option>';
    }
}

async function cargarCiudades() {
    const selectProv = document.getElementById('provincia');
    const selectCiudad = document.getElementById('ciudad');
    const provincia = selectProv.value;
    if (!provincia) {
        selectCiudad.disabled = true;
        selectCiudad.innerHTML = '<option value="">Primero elegí una provincia</option>';
        return;
    }
    selectCiudad.disabled = true;
    selectCiudad.innerHTML = '<option value="">Cargando ciudades...</option>';
    try {
        const res = await fetch(`https://apis.datos.gob.ar/georef/api/localidades?campos=nombre&max=5000&provincia=${encodeURIComponent(provincia)}`);
        const data = await res.json();
        const localidades = (data.localidades || []).map(l => l.nombre).sort((a,b)=>a.localeCompare(b,'es'));
        selectCiudad.innerHTML = '<option value="">Seleccioná una ciudad</option>';
        localidades.forEach(ciudad => {
            const opt = document.createElement('option');
            opt.value = ciudad;
            opt.textContent = ciudad;
            selectCiudad.appendChild(opt);
        });
        selectCiudad.disabled = false;
    } catch(e) {
        console.error('Error cargando ciudades:', e);
        selectCiudad.innerHTML = '<option value="">Error al cargar ciudades</option>';
    }
}

// ============================================================
// 2. VALIDACIÓN DEL FORMULARIO
// ============================================================
function validateAndStart() {
    const errorDiv = document.getElementById("form-error");
    errorDiv.style.display = "none";
    errorDiv.innerText = "";
    
    const nombre = document.getElementById("nombre").value.trim();
    const apellido = document.getElementById("apellido").value.trim();
    const edadRaw = document.getElementById("edad").value.trim();
    const genero = document.getElementById("genero").value;
    const educacion = document.getElementById("educacion").value;
    const provincia = document.getElementById("provincia").value;
    const ciudad = document.getElementById("ciudad").value;
    
    let errors = [];
    
    if (nombre === "") errors.push("El nombre no puede estar vacío.");
    if (apellido === "") errors.push("El apellido no puede estar vacío.");
    if (edadRaw === "") {
        errors.push("Debes ingresar una edad.");
    } else {
        const edadNum = Number(edadRaw);
        if (isNaN(edadNum) || !Number.isInteger(edadNum) || edadNum < 1 || edadNum > 120) {
            errors.push("La edad debe ser un número entero entre 1 y 120.");
        }
    }
    if (genero === "" || genero === "Género") errors.push("Debes seleccionar un género.");
    if (educacion === "" || educacion === "Nivel educativo") errors.push("Debes seleccionar un nivel educativo.");
    if (provincia === "") errors.push("Debes seleccionar una provincia.");
    if (ciudad === "") errors.push("Debes seleccionar una ciudad.");
    
    if (errors.length > 0) {
        errorDiv.innerText = errors.join(" ");
        errorDiv.style.display = "block";
        return;
    }
    
    start();
}

// ============================================================
// 3. RESTO DEL EXPERIMENTO (CORPUS, ESTÍMULOS, GUARDADO)
// ============================================================
let corpus=[], stimuli=[], i=0, data=[], correct=0, startTime;
const isMobile = /Mobi|Android/i.test(navigator.userAgent);
let historicalData = [];

async function loadHistoricalData() {
    try {
        const response = await fetch("/api/stats");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();
        let rawData = Array.isArray(json) ? json : (json.data || json.resultados || []);
        historicalData = rawData.map(item => ({
            promedio_ms: typeof item.promedio_ms === 'number' ? item.promedio_ms : parseFloat(item.promedio_ms),
            precision: typeof item.precision === 'number' ? item.precision : (typeof item.precision === 'string' ? parseFloat(item.precision) : 0.5)
        })).filter(item => !isNaN(item.promedio_ms));
    } catch(e) {
        console.error("Error cargando datos históricos:", e);
        historicalData = [];
    }
}

async function loadCorpus(){
    try{
        const r=await fetch("/api/words");
        const j=await r.json();
        corpus=j.palabras;
    } catch{
        corpus=["casa","perro","libro","mesa","zapato"];
    }
}

function fakeWord(p){
    const rules=[
        w=>w.replace(/h/g,""),
        w=>w.replace(/s/g,"z"),
        w=>w.replace(/c/g,"k"),
        w=>w.replace(/v/g,"b"),
        w=>w+"o"
    ];
    let w=rules[Math.floor(Math.random()*rules.length)](p);
    return corpus.includes(w)?p+"o":w;
}

function makeStimuli(n=30){
    let arr=[], used=new Set();
    while(arr.length<n){
        let base=corpus[Math.floor(Math.random()*corpus.length)];
        let real=Math.random()<0.5;
        let word=real?base:fakeWord(base);
        if(!used.has(word)){
            used.add(word);
            arr.push({text:word,correct:real});
        }
    }
    return arr;
}

function goForm(){
    document.getElementById("intro").classList.add("hidden");
    document.getElementById("form").classList.remove("hidden");
    cargarProvincias();   // carga las provincias desde la API
}

async function start(){
    document.getElementById("form").classList.add("hidden");
    await loadCorpus();
    await loadHistoricalData();
    
    const countdownDiv = document.getElementById("countdown");
    countdownDiv.classList.remove("hidden");
    for(let n=3;n>0;n--){
        countdownDiv.innerText=n;
        await new Promise(r=>setTimeout(r,1000));
    }
    countdownDiv.innerText="YA";
    await new Promise(r=>setTimeout(r,500));
    countdownDiv.classList.add("hidden");
    
    stimuli = makeStimuli();
    document.getElementById("test").classList.remove("hidden");
    if(isMobile) document.getElementById("mobileBtns").classList.remove("hidden");
    next();
}

function next(){
    if(i>=stimuli.length) return finish();
    document.getElementById("word").innerText = stimuli[i].text;
    startTime = performance.now();
}

function answer(resp){
    let t = performance.now() - startTime;
    let ok = (resp === stimuli[i].correct);
    if(ok) correct++;
    data.push({
        palabra: stimuli[i].text,
        respuesta: resp,
        correcta: stimuli[i].correct,
        acierto: ok,
        tiempo: t
    });
    i++;
    next();
}

document.addEventListener("keydown", e=>{
    if(e.key==="s") answer(true);
    if(e.key==="n") answer(false);
});

async function finish(){
    document.getElementById("test").classList.add("hidden");
    
    let avgTime = data.reduce((a,b)=>a+b.tiempo,0)/data.length;
    let accuracy = (correct/data.length)*100;
    let totalNo = data.filter(d => d.respuesta === false).length;
    let noPercent = (totalNo / data.length) * 100;
    
    // Obtener datos del participante (incluyendo provincia y ciudad)
    const participanteData = {
        nombre: document.getElementById("nombre").value.trim(),
        apellido: document.getElementById("apellido").value.trim(),
        edad: document.getElementById("edad").value.trim(),
        genero: document.getElementById("genero").value,
        educacion: document.getElementById("educacion").value,
        provincia: document.getElementById("provincia").value,
        ciudad: document.getElementById("ciudad").value
    };
    
    // Guardar en servidor
    try {
        await fetch("/api/save",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                participante: participanteData,
                trials: data
            })
        });
    } catch(e) { console.warn("No se pudo guardar en servidor"); }
    
    // Mostrar resultados (igual que antes)
    const resultsDiv = document.getElementById("results");
    resultsDiv.classList.remove("hidden");
    
    const hasHistorical = historicalData.length >= 2;
    let tiempoComparacion = "", precisionComparacion = "", timePercentile = null, accPercentile = null;
    let meanTime = null, meanAcc = null, timeComparison = "", accComparison = "";
    
    if (hasHistorical) {
        let tiemposHist = historicalData.map(h => h.promedio_ms);
        let precisionsHist = historicalData.map(h => h.precision * 100);
        tiemposHist.sort((a,b)=>a-b);
        precisionsHist.sort((a,b)=>a-b);
        timePercentile = computePercentile(tiemposHist, avgTime);
        accPercentile = computePercentile(precisionsHist, accuracy);
        meanTime = tiemposHist.reduce((a,b)=>a+b,0)/tiemposHist.length;
        meanAcc = precisionsHist.reduce((a,b)=>a+b,0)/precisionsHist.length;
        timeComparison = (avgTime < meanTime) ? "por debajo del promedio (más rápido)" : (avgTime > meanTime) ? "por encima del promedio (más lento)" : "en el promedio";
        accComparison = (accuracy > meanAcc) ? "por encima del promedio (más preciso)" : (accuracy < meanAcc) ? "por debajo del promedio (menos preciso)" : "en el promedio";
        tiempoComparacion = `(${timeComparison})`;
        precisionComparacion = `(${accComparison})`;
    }
    
    let html = `<h3>Resultados individuales</h3><div class="results-card"><p><b>Tiempo promedio:</b> ${avgTime.toFixed(2)} ms ${tiempoComparacion}</p>
                <p><b>Precisión:</b> ${accuracy.toFixed(2)}% ${precisionComparacion}</p>`;
    if (hasHistorical) {
        html += `<p><b>Percentil de velocidad:</b> ${timePercentile.toFixed(1)}% (más rápido que el ${timePercentile.toFixed(1)}% de participantes anteriores)</p>
                 <p><b>Percentil de precisión:</b> ${accPercentile.toFixed(1)}% (más preciso que el ${accPercentile.toFixed(1)}% de participantes)</p>`;
    } else {
        html += `<p><em>No hay suficientes datos históricos para comparar (mínimo 2 registros en /api/stats).</em></p>`;
    }
    html += `</div>`;
    resultsDiv.innerHTML = html;
    
    if (hasHistorical) {
        let isFast = timePercentile <= 25;
        let isLowAccuracy = accuracy < 60;
        let impulsive = isFast && isLowAccuracy;
        if(impulsive) {
            resultsDiv.innerHTML += `<div class="warning"><b>⚠️ Respuestas impulsivas detectadas</b><br>Tu tiempo es muy rápido (percentil ≤ 25) pero tu precisión es baja (<60%).</div>`;
        } else if (isFast && accuracy >= 80) {
            resultsDiv.innerHTML += `<div class="good"><b>✅ Buen rendimiento</b><br>Respuestas rápidas y precisas.</div>`;
        } else if (!isFast && isLowAccuracy) {
            resultsDiv.innerHTML += `<div class="warning"><b>⚠️ Lentitud y baja precisión</b><br>Respuestas lentas y con errores.</div>`;
        }
    } else if (accuracy < 60) {
        resultsDiv.innerHTML += `<div class="warning"><b>⚠️ Baja precisión</b><br>Revisa las instrucciones.</div>`;
    }
    
    if (noPercent > 70 && accuracy < 60) {
        resultsDiv.innerHTML += `<div class="warning">⚠️ Has respondido 'NO' en más del 70% de los ensayos con baja precisión.</div>`;
    }
    
    if (hasHistorical) {
        resultsDiv.innerHTML += `<div class="results-card"><h4>Comparativa con el grupo (${historicalData.length} participantes previos)</h4>
            <p>📊 Velocidad media: ${meanTime.toFixed(0)} ms | Tu velocidad: ${avgTime.toFixed(0)} ms → ${timeComparison}</p>
            <p>🎯 Precisión media: ${meanAcc.toFixed(1)}% | Tu precisión: ${accuracy.toFixed(1)}% → ${accComparison}</p></div>`;
        drawTimeDistribution(avgTime, historicalData.map(h=>h.promedio_ms));
    } else {
        resultsDiv.innerHTML += `<div class="results-card"><p>📉 No hay suficientes datos históricos para el gráfico.</p></div>`;
    }
}

function computePercentile(sortedArray, value) {
    if(sortedArray.length === 0) return 50;
    let count = sortedArray.filter(v => v <= value).length;
    return (count / sortedArray.length) * 100;
}

function drawTimeDistribution(userTime, historicalTimes) {
    const resultsDiv = document.getElementById("results");
    let oldCanvas = resultsDiv.querySelector("canvas");
    if(oldCanvas) oldCanvas.remove();
    if (historicalTimes.length < 2) return;
    const canvas = document.createElement("canvas");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = 700 * dpr;
    canvas.height = 350 * dpr;
    canvas.style.width = "700px";
    canvas.style.height = "350px";
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    resultsDiv.appendChild(canvas);
    const padding = 60, width = canvas.width - padding*2, height = canvas.height - padding*2;
    let mean = historicalTimes.reduce((a,b)=>a+b,0)/historicalTimes.length;
    let variance = historicalTimes.reduce((a,b)=>a + Math.pow(b-mean,2),0)/historicalTimes.length;
    let std = Math.sqrt(variance) || 1;
    let min = Math.min(...historicalTimes, userTime) - 50;
    let max = Math.max(...historicalTimes, userTime) + 50;
    if(std < 20) { min = mean - 100; max = mean + 100; }
    const scaleX = v => padding + ((v - min)/(max - min))*width;
    function gaussian(x){ return (1/(std*Math.sqrt(2*Math.PI))) * Math.exp(-0.5 * Math.pow((x-mean)/std,2)); }
    const peak = gaussian(mean);
    ctx.fillStyle = "#0b1b34";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    for(let i=0;i<=5;i++){ let y = padding + (i/5)*height; ctx.beginPath(); ctx.moveTo(padding,y); ctx.lineTo(padding+width,y); ctx.stroke(); }
    ctx.beginPath();
    for(let x=min; x<=max; x+= (max-min)/200){
        let y = gaussian(x), px = scaleX(x), py = padding + height - (y/peak)*height;
        if(x===min) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.lineTo(scaleX(max), padding+height); ctx.lineTo(scaleX(min), padding+height); ctx.closePath();
    let grad = ctx.createLinearGradient(0,0,0,canvas.height);
    grad.addColorStop(0,"rgba(76,201,240,0.4)"); grad.addColorStop(1,"rgba(76,201,240,0)");
    ctx.fillStyle = grad; ctx.fill();
    ctx.strokeStyle = "#4cc9f0"; ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x=min; x<=max; x+= (max-min)/200){
        let y = gaussian(x), px = scaleX(x), py = padding + height - (y/peak)*height;
        if(x===min) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke();
    let xMean = scaleX(mean);
    ctx.setLineDash([6,6]); ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.beginPath(); ctx.moveTo(xMean, padding); ctx.lineTo(xMean, padding+height); ctx.stroke();
    ctx.fillStyle = "white"; ctx.fillText("Media histórica", xMean-40, padding-10);
    let xUser = scaleX(userTime);
    ctx.setLineDash([]); ctx.strokeStyle = "#ff4d4d"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(xUser, padding); ctx.lineTo(xUser, padding+height); ctx.stroke();
    ctx.fillStyle = "#ff4d4d"; ctx.fillText("Tu tiempo", xUser-30, padding-10);
    ctx.strokeStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath(); ctx.moveTo(padding, padding+height); ctx.lineTo(padding+width, padding+height); ctx.stroke();
    ctx.fillStyle = "white";
    ctx.fillText(`${Math.round(min)} ms`, padding, padding+height+20);
    ctx.fillText(`${Math.round(max)} ms`, padding+width-50, padding+height+20);
    ctx.fillText("Tiempo de reacción (ms)", padding+width/2-80, padding+height+40);
}
</script>
</body>
</html>
