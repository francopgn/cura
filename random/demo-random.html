<html lang="es">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cura: {
              primary:     '#004E85',
              primaryDark: '#00345C',
              card:        '#065D9B',
              accent:      '#00C2FF',
              accentLight: '#59D2FF'
            }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg-deep:      #00223d;
      --bg-mid:       #002f52;
      --card-bg:      rgba(255,255,255,0.04);
      --card-border:  rgba(0,194,255,0.18);
      --card-hover:   rgba(0,194,255,0.10);
      --accent:       #00C2FF;
      --accent-light: #59D2FF;
      --accent-dim:   rgba(0,194,255,0.35);
      --text-main:    #e8f4ff;
      --text-muted:   rgba(89,210,255,0.65);
      --text-dim:     rgba(89,210,255,0.4);
      --warn-bg:      rgba(251,191,36,0.07);
      --warn-border:  rgba(251,191,36,0.25);
      --warn-text:    #fbbf24;
      --warn-label:   rgba(251,191,36,0.55);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--text-main);
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    main, header, footer { position: relative; z-index: 1; }

    .site-header {
      background: rgba(0,34,61,0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
    }

    .section-label {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--text-dim); padding-left: 2px;
    }

    .cura-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .cura-card:hover { border-color: var(--accent-dim); background: var(--card-hover); }

    .patient-hero {
      background: linear-gradient(135deg, rgba(6,93,155,0.5) 0%, rgba(0,78,133,0.35) 100%);
      border: 1px solid rgba(0,194,255,0.25);
      border-radius: 24px; overflow: hidden; position: relative;
    }
    .patient-hero::before {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 160px; height: 160px;
      background: radial-gradient(circle, rgba(0,194,255,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .photo-ring {
      width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid var(--accent-dim); overflow: hidden;
      background: rgba(0,194,255,0.08); flex-shrink: 0;
      box-shadow: 0 0 0 4px rgba(0,194,255,0.06);
    }
    .photo-ring img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* TIPO DE SANGRE — PROMINENTE */
    .blood-type-wrap {
      background: rgba(0,194,255,0.12);
      border: 1.5px solid rgba(0,194,255,0.35);
      border-radius: 14px;
      padding: 8px 14px;
      display: flex; flex-direction: column;
      align-items: center; gap: 2px;
      flex-shrink: 0;
    }
    .blood-type-value {
      font-size: 1.9rem; font-weight: 800; line-height: 1;
      color: #fff; letter-spacing: -0.03em;
      text-shadow: 0 0 20px rgba(0,194,255,0.7), 0 0 48px rgba(0,194,255,0.35);
    }
    .blood-type-label {
      font-size: 0.48rem; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--text-dim);
    }

    .data-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(0,194,255,0.07); border: 1px solid rgba(0,194,255,0.14);
      border-radius: 8px; padding: 4px 10px;
      font-size: 0.65rem; font-weight: 600; color: var(--accent-light);
    }
    .data-chip .chip-label { color: var(--text-dim); font-weight: 500; }

    .btn-emergency {
      width: 100%;
      background: linear-gradient(90deg, #004E85 0%, #065D9B 100%);
      border: 1px solid rgba(0,194,255,0.3); border-radius: 14px; padding: 14px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: #fff; cursor: pointer; transition: all 0.2s ease;

    .btn-emergency:active { transform: scale(0.97); opacity: 0.9; }
    .btn-emergency:hover  { border-color: var(--accent); background: linear-gradient(90deg, #065D9B 0%, #0070bb 100%); }

    .btn-refresh {
      width: 100%; background: transparent;
      border: 1px solid var(--card-border); border-radius: 14px; padding: 12px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-muted); cursor: pointer; transition: all 0.2s ease;

    .btn-refresh:hover  { border-color: var(--accent-dim); color: var(--accent-light); background: var(--card-hover); }
    .btn-refresh:active { transform: scale(0.97); }

    .warn-strip { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 16px; overflow: hidden; }
    .warn-header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--warn-border); }
    .warn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn-text); animation: pulse-warn 2s ease-in-out infinite; }
    @keyframes pulse-warn { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }
    .warn-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 9px 16px; border-bottom: 1px solid rgba(251,191,36,0.1);
      font-size: 0.7rem; font-weight: 600; color: var(--warn-text); line-height: 1.45;
    }
    .warn-item:last-child { border-bottom: none; }
    .warn-item i { flex-shrink: 0; margin-top: 1px; font-size: 0.9rem; color: var(--warn-label); }

    .condition-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      transition: border-color 0.2s, background 0.2s;

    .condition-card:hover { border-color: var(--accent-dim); background: var(--card-hover); }
    .condition-icon {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      background: rgba(0,194,255,0.08); border: 1px solid rgba(0,194,255,0.15);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 1.15rem;

    .implant-card {
      background: rgba(99,102,241,0.07); border: 1px solid rgba(99,102,241,0.22);
      border-radius: 16px; padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .implant-icon {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.22);
      display: flex; align-items: center; justify-content: center;
      color: #a5b4fc; font-size: 1.15rem;
    }

      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid rgba(0,194,255,0.07); gap: 8px;

      font-size: 0.55rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;

    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--card-border), transparent); margin: 8px 0; }

    .timestamp-bar {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.58rem; font-weight: 600; letter-spacing: 0.12em;
      color: var(--text-dim); text-transform: uppercase;

    .delay-1  { animation-delay:0.05s; opacity:0; }
    .delay-2  { animation-delay:0.10s; opacity:0; }
    .delay-3  { animation-delay:0.15s; opacity:0; }

    ::-webkit-scrollbar-track { background: transparent; }

<script>
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function choice(arr)        { return arr[randInt(0, arr.length - 1)]; }

function fechaRandom() {
  const y = randInt(1945, 2010), m = randInt(1, 12);
  const d = randInt(1, [4,6,9,11].includes(m) ? 30 : (m === 2 ? 28 : 31));
  return { d, m, y };
}
function formatear(d, m, y) {
  return d.toString().padStart(2,'0') + '/' + m.toString().padStart(2,'0') + '/' + y;
}
function calcEdad(d, m, y) {
  const n = new Date(y, m-1, d), h = new Date();
  let e = h.getFullYear() - n.getFullYear();
  if (h.getMonth() < n.getMonth() || (h.getMonth() === n.getMonth() && h.getDate() < n.getDate())) e--;
  return e;
}

/* Foto filtrada por rango etario via randomuser.me API */
async function fetchFotoEdad(sexo, edadPaciente) {
  const gender = sexo === 'M' ? 'male' : 'female';
  const margen = 12;
  const minAge = Math.max(18, edadPaciente - margen);
  const maxAge = edadPaciente + margen;
  try {
    const res  = await fetch(`https://randomuser.me/api/?gender=${gender}&nat=ar,es,mx&results=15`);
    const data = await res.json();
    const filtrados = data.results.filter(u => u.dob.age >= minAge && u.dob.age <= maxAge);
    const usuario   = filtrados.length > 0 ? filtrados[0] : data.results[0];
    document.getElementById('foto-paciente').src = usuario.picture.large;
  } catch {
    document.getElementById('foto-paciente').src =
      `https://randomuser.me/api/portraits/${sexo === 'M' ? 'men' : 'women'}/${randInt(1,99)}.jpg`;
  }
}

   INIT
══════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {

  /* Timestamp */
  const ahora = new Date();
  const opciones = { weekday:'short', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' };
  document.getElementById('hora-acceso').textContent =
    'Acceso registrado · ' + ahora.toLocaleDateString('es-AR', opciones).toUpperCase();

  /* Médico */
  const med = choice(medicos);
  document.getElementById('random-medico').innerHTML =
    `${med}<br><span style="font-weight:500;color:rgba(89,210,255,0.45)">M.P.&nbsp;${randInt(10000,99999)}&nbsp;·&nbsp;M.N.&nbsp;${randInt(100000,999999)}</span>`;

  /* Paciente */
  const sexo = Math.random() < 0.5 ? 'M' : 'F';
  document.getElementById('nombre-completo').textContent =
    choice(sexo === 'M' ? nombresM : nombresF) + ' ' + choice(apellidos);
  document.getElementById('dni').textContent =
    randInt(15000000, 50000000).toLocaleString('es-AR');
  const fn = fechaRandom();
  document.getElementById('fecha-nac').textContent = formatear(fn.d, fn.m, fn.y);
  const pacEdad = calcEdad(fn.d, fn.m, fn.y);
  document.getElementById('edad').textContent = pacEdad;
  document.getElementById('tipo-sangre').textContent = choice(sangres);

  /* Foto filtrada por edad */
  fetchFotoEdad(sexo, pacEdad);

  /* Lógica: 10% sano · 60% 1 cond · 25% 2 cond · 5% 3 cond */
  const prob    = Math.random();
  const numCond = prob < 0.10 ? 0 : prob < 0.70 ? 1 : prob < 0.95 ? 2 : 3;

  const usadas    = [], advArr = [];
  const contCond  = document.getElementById('lista-condiciones');
  const listaMeds = document.getElementById('lista-medicacion');

  if (numCond === 0) {
    contCond.innerHTML  = `<p class="empty-state">Sin condiciones reportadas.</p>`;
    listaMeds.innerHTML = `<li class="med-row"><span class="empty-state">Sin medicación en curso.</span></li>`;
  } else {
    while (usadas.length < numCond) {
      const c = choice(condicionesCatalogo);
      if (!usadas.includes(c)) {
        usadas.push(c);
        advArr.push(...c.adv);
        contCond.innerHTML += `
          <div class="condition-card">
            <div class="condition-icon"><i class="${c.icon}"></i></div>
            <div>
              <p class="text-sm font-bold text-white leading-tight">${c.titulo}</p>
              <p class="text-[10px] font-medium mt-0.5" style="color:var(--text-muted)">${c.subt}</p>
            </div>
          </div>`;
        c.meds.forEach(m => {
          listaMeds.innerHTML += `
            <li class="med-row">
              <span class="text-sm font-semibold text-white">${m[0]}</span>
              <span class="med-badge">${m[1]}</span>
            </li>`;
        });
      }
    }
  }

  /* Implantes */
  const contImpl = document.getElementById('lista-implantes');
  if (Math.random() < 0.45) {
    const im = choice(implantes);
    advArr.push(im.a);
    contImpl.innerHTML = `
      <div class="implant-card">
        <div class="implant-icon"><i class="${im.icon}"></i></div>
        <div>
          <p class="text-sm font-bold text-white leading-tight">${im.t}</p>
          <p class="text-[10px] font-medium mt-0.5" style="color:rgba(165,180,252,0.75)">${im.d}</p>
        </div>
      </div>`;
  } else {
    contImpl.innerHTML = `<p class="empty-state">Sin implantes reportados.</p>`;
  }

  /* Advertencias */
  const advC   = document.getElementById('lista-advertencias');
  const unicas = [...new Set(advArr)];
  if (unicas.length === 0) {
    advC.innerHTML = `<li class="warn-item"><i class="ph ph-check-circle"></i>Sin advertencias reportadas.</li>`;
  } else {
    unicas.forEach(a => {
      advC.innerHTML += `<li class="warn-item"><i class="ph-fill ph-warning-circle"></i>${a}</li>`;
    });
  }
});
</script>
