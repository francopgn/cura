<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Solicitar Turno - C.U.R.A.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --bg-dark:#00345C; --cura-blue:#004E85; --accent:#00C2FF; --glass:rgba(255,255,255,0.05); --glass-border:rgba(255,255,255,0.1); }
    body { background-color:var(--bg-dark); background-image:radial-gradient(circle at top right,rgba(0,78,133,0.5),transparent),radial-gradient(circle at bottom left,rgba(0,194,255,0.05),transparent); color:white; margin:0; display:flex; justify-content:center; min-height:100vh; font-family:'Inter',sans-serif; overflow-x:hidden; }
    .app-shell { width:100%; max-width:414px; padding:20px; padding-bottom:120px; display:flex; flex-direction:column; }
    .header-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 5px; margin-bottom:25px; }
    .back-btn { width:40px; height:40px; border-radius:12px; background:var(--glass); border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; cursor:pointer; }

    .form-card { background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--glass-border); border-radius:32px; padding:24px; margin-bottom:20px; box-shadow:0 25px 50px rgba(0,0,0,0.3); }

    .section-label { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin-bottom:8px; display:block; }

    .input-text, .select-field { width:100%; padding:14px 18px; border-radius:18px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.05); color:white; font-size:15px; outline:none; transition:all 0.3s; box-sizing:border-box; }
    .input-text:focus, .select-field:focus { border-color:var(--accent); background:rgba(255,255,255,0.1); }
    select option { background:var(--bg-dark); color:white; }

    .pill { padding:10px 16px; border-radius:14px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.05); font-size:12px; font-weight:700; color:white; cursor:pointer; transition:0.2s; }
    .pill.active { background:var(--accent); color:var(--bg-dark); border-color:var(--accent); }

    .info-box { background:rgba(0,194,255,0.1); border-radius:18px; padding:14px; display:flex; gap:12px; align-items:flex-start; margin-top:12px; border:1px solid rgba(0,194,255,0.2); }
    .info-icon { width:22px; height:22px; background:var(--accent); color:var(--bg-dark); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; flex-shrink:0; margin-top:1px; }
    .info-text { font-size:12px; color:var(--accent); line-height:1.5; font-weight:500; }

    .info-box.tele { background:rgba(16,185,129,0.1); border-color:rgba(16,185,129,0.25); }
    .info-box.tele .info-text { color:#10b981; }
    .info-box.tele .info-icon { background:#10b981; }

    .info-box.warning { background:rgba(251,191,36,0.1); border-color:rgba(251,191,36,0.25); }
    .info-box.warning .info-text { color:#fbbf24; }
    .info-box.warning .info-icon { background:#fbbf24; }

    .chip-suggestion { display:inline-block; padding:5px 12px; border-radius:10px; background:rgba(34,197,94,0.2); color:#4ade80; font-size:11px; font-weight:800; margin-top:10px; }

    .option-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; font-size:15px; cursor:pointer; }
    .option-row input[type="radio"] { width:22px; height:22px; accent-color:var(--accent); cursor:pointer; }

    /* Aviso telemedicina */
    .tele-aviso { display:none; margin-top:12px; }

    .btn-submit { width:100%; padding:18px; border-radius:22px; border:none; background:var(--accent); color:var(--bg-dark); font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 10px 25px rgba(0,194,255,0.3); margin-top:6px; transition:transform 0.2s; }
    .btn-submit:active { transform:scale(0.97); }

    .btn-mis-turnos { width:100%; padding:14px; border-radius:18px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.05); color:white; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; transition:background 0.2s; }
    .btn-mis-turnos:hover { background:rgba(255,255,255,0.1); }

    .bottom-bar { position:fixed; bottom:25px; left:50%; transform:translateX(-50%); width:85%; max-width:350px; background:rgba(6,93,155,0.7); backdrop-filter:blur(20px); border-radius:30px; height:70px; display:flex; align-items:center; justify-content:space-around; border:1px solid var(--glass-border); z-index:1000; }
    .nav-btn { color:rgba(255,255,255,0.4); font-size:24px; background:none; border:none; cursor:pointer; }
    .nav-btn.active { color:var(--accent); }
    .center-btn { width:60px; height:60px; background:var(--accent); color:var(--bg-dark); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:bold; margin-top:-40px; box-shadow:0 8px 20px rgba(0,194,255,0.4); cursor:pointer; }

    .modal-backdrop { position:fixed; inset:0; background:rgba(0,52,92,0.4); backdrop-filter:blur(10px); display:none; justify-content:center; align-items:center; padding:20px; z-index:2000; }
    .modal { background:#ffffff; width:100%; max-width:360px; border-radius:35px; padding:28px; box-shadow:0 20px 50px rgba(0,0,0,0.3); color:#0d2b52; max-height:88vh; overflow-y:auto; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="header-bar">
      <button class="back-btn" onclick="history.back()"><i class="ph-bold ph-caret-left"></i></button>
      <div class="text-lg font-extrabold">Solicitar Turno</div>
      <div style="width:40px"></div>
    </header>

    <main>
      <div class="form-card">

        <!-- ESTABLECIMIENTO -->
        <div class="mb-5">
          <label class="section-label">Establecimiento</label>
          <input type="text" class="input-text" placeholder="Buscar centro de salud o por cercanía...">
          <div class="flex gap-2 mt-3">
            <button class="pill active"><i class="ph-bold ph-map-pin"></i> Ubicación actual</button>
          </div>
        </div>

        <!-- ESPECIALIDAD -->
        <div class="mb-5">
          <label class="section-label">Especialidad</label>
          <select class="select-field" id="especialidad">
            <option value="">Seleccionar especialidad</option>
            <option value="clinica">Clínica médica</option>
            <option value="cardiologia">Cardiología</option>
            <option value="traumatologia">Traumatología</option>
            <option value="salud_mental">Salud mental</option>
            <option value="ginecologia">Ginecología / Obstetricia</option>
            <option value="pediatria">Pediatría</option>
            <option value="neurologia">Neurología</option>
            <option value="endocrinologia">Endocrinología</option>
          </select>
        </div>

        <!-- MOTIVO -->
        <div class="mb-5">
          <label class="section-label">Motivo de la consulta</label>
          <input type="text" id="motivo" class="input-text" placeholder="Ej: Control, dolor de pecho, receta...">
          <div id="chip-sugerencia" class="chip-suggestion" style="display:none;"></div>
          <div class="info-box" id="info-docs">
            <div class="info-icon">i</div>
            <div class="info-text" id="doc-text">Indicá el motivo para recibir recomendaciones previas al turno.</div>
          </div>
        </div>

        <!-- FECHA Y FRANJA -->
        <div class="flex gap-3 mb-5">
          <div class="flex-1">
            <label class="section-label">Fecha</label>
            <input type="date" class="input-text">
          </div>
          <div class="flex-1">
            <label class="section-label">Franja horaria</label>
            <select class="select-field">
              <option>Mañana (8-12hs)</option>
              <option>Tarde (12-16hs)</option>
              <option>Tarde-noche (16-20hs)</option>
            </select>
          </div>
        </div>

        <!-- MODALIDAD — La Ley C.U.R.A. establece integración obligatoria de videoconsulta -->
        <div class="mb-5">
          <label class="section-label">Modalidad</label>
          <div class="space-y-2">
            <label class="option-row">
              <input type="radio" name="mod" id="radio-presencial" checked onchange="cambiarModalidad('presencial')">
              <span>Presencial</span>
            </label>
            <label class="option-row">
              <input type="radio" name="mod" id="radio-tele" onchange="cambiarModalidad('tele')">
              <span>Videoconsulta (Telemedicina C.U.R.A.)</span>
            </label>
          </div>
          <!-- Aviso dinámico al elegir telemedicina -->
          <div class="tele-aviso info-box tele" id="tele-aviso">
            <div class="info-icon"><i class="ph-bold ph-video" style="font-size:11px;"></i></div>
            <div class="info-text">La videoconsulta se realizará desde el módulo de Telemedicina del sistema C.U.R.A. Recibirás el enlace de acceso con 24hs de anticipación.</div>
          </div>
        </div>

        <!-- COBERTURA -->
        <div class="mb-6">
          <label class="section-label">Obra Social / Cobertura</label>
          <select class="select-field">
            <option>PAMI</option>
            <option>Sistema Público (Sin cobertura)</option>
            <option>OSDE</option>
            <option>Swiss Medical</option>
            <option>IOMA</option>
            <option>OSECAC</option>
            <option>Galeno</option>
          </select>
        </div>

        <!-- CONFIRMAR — destino: turno-confirmado.html (archivo existente) -->
        <button class="btn-submit" onclick="confirmarTurno()">
          Confirmar solicitud de turno
        </button>

        <!-- ACCESO A MIS TURNOS -->
        <button class="btn-mis-turnos" onclick="location.href='mis-turnos.html'">
          <i class="ph-bold ph-calendar-blank"></i> Ver mis turnos agendados
        </button>

      </div>
    </main>

    <!-- BOTTOM BAR — links corregidos, ícono farmacias unificado -->
    <nav class="bottom-bar">
      <button class="nav-btn" onclick="location.href='menu__15_.html'" title="Inicio"><i class="ph-bold ph-house-line"></i></button>
      <button class="nav-btn active" onclick="location.href='solicitar-turno__1_.html'" title="Turnos"><i class="ph-bold ph-calendar-blank"></i></button>
      <div class="center-btn" onclick="abrirModalAyuda()">?</div>
      <button class="nav-btn" onclick="location.href='farmacias__9_.html'" title="Farmacias"><i class="ph-bold ph-heartbeat"></i></button>
      <button class="nav-btn" onclick="location.href='perfil.html'" title="Perfil"><i class="ph-bold ph-user-circle"></i></button>
    </nav>
  </div>

  <!-- MODAL -->
  <div id="modal-container" class="modal-backdrop" onclick="cerrarModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-6">
        <h3 id="modal-title" class="text-xl font-extrabold">Ayuda: Turnos</h3>
        <button onclick="cerrarModal()" class="bg-gray-100 p-2 rounded-full"><i class="ph ph-x"></i></button>
      </div>
      <div id="modal-body" class="space-y-5 text-sm text-gray-600"></div>
      <div class="mt-8 pt-5 border-t border-gray-100">
        <button onclick="cerrarModal()" class="flex items-center gap-2 font-bold text-lg" style="color:#004E85">
          <i class="ph-bold ph-arrow-left"></i> Volver
        </button>
      </div>
    </div>
  </div>

  <script>
    const motivoInput      = document.getElementById("motivo");
    const chipSugerencia   = document.getElementById("chip-sugerencia");
    const docText          = document.getElementById("doc-text");
    const especialidadSel  = document.getElementById("especialidad");
    const infoBox          = document.getElementById("info-docs");
    const teleAviso        = document.getElementById("tele-aviso");

    // ── CAMBIO MODALIDAD ──
    function cambiarModalidad(tipo) {
      if (tipo === "tele") {
        teleAviso.style.display = "flex";
      } else {
        teleAviso.style.display = "none";
      }
    }

    // ── SUGERENCIA INTELIGENTE POR MOTIVO ──
    motivoInput.addEventListener("input", () => {
      const val = motivoInput.value.toLowerCase();

      if (val.includes("pecho") || val.includes("corazon") || val.includes("corazón")) {
        especialidadSel.value = "cardiologia";
        chipSugerencia.textContent = "✓ Sugerencia: Cardiología";
        chipSugerencia.style.display = "inline-block";
        docText.textContent = "Traé tu último electrocardiograma o análisis de sangre si lo tenés.";
        infoBox.className = "info-box warning";
      } else if (val.includes("ansiedad") || val.includes("dormir") || val.includes("pánico") || val.includes("panico")) {
        especialidadSel.value = "salud_mental";
        chipSugerencia.textContent = "✓ Sugerencia: Salud Mental";
        chipSugerencia.style.display = "inline-block";
        docText.textContent = "Podés solicitar este turno vía Videoconsulta para una atención más rápida y cómoda.";
        infoBox.className = "info-box tele";
      } else if (val.includes("receta") || val.includes("renovar")) {
        chipSugerencia.textContent = "✓ Sugerencia: Clínica médica";
        especialidadSel.value = "clinica";
        chipSugerencia.style.display = "inline-block";
        docText.textContent = "Para renovación de recetas crónicas podés solicitar videoconsulta sin necesidad de traslado.";
        infoBox.className = "info-box tele";
      } else {
        chipSugerencia.style.display = "none";
        docText.textContent = "El sistema asignará la especialidad más adecuada según tu historial clínico C.U.R.A.";
        infoBox.className = "info-box";
      }
    });

    // ── CONFIRMAR TURNO → turno-confirmado.html ──
    function confirmarTurno() {
      window.location.href = "turno-confirmado.html";
    }

    // ── AYUDA ──
    function abrirModalAyuda() {
      document.getElementById('modal-title').innerText = "Ayuda: Turnos";
      document.getElementById('modal-body').innerHTML = `
        <div class="flex gap-4">
          <i class="ph-bold ph-brain" style="color:#004E85;font-size:22px;flex-shrink:0;"></i>
          <p><strong>Asignación inteligente:</strong> Describí tu síntoma y el sistema sugerirá la especialidad correcta según tu historial clínico C.U.R.A.</p>
        </div>
        <div class="flex gap-4">
          <i class="ph-bold ph-video" style="color:#10b981;font-size:22px;flex-shrink:0;"></i>
          <p><strong>Videoconsulta:</strong> Para muchos motivos podés elegir atención por videollamada desde el módulo de Telemedicina C.U.R.A., evitando traslados innecesarios.</p>
        </div>
        <div class="flex gap-4">
          <i class="ph-bold ph-calendar-blank" style="color:#004E85;font-size:22px;flex-shrink:0;"></i>
          <p><strong>Mis turnos:</strong> Una vez confirmado, el turno queda registrado en tu agenda. Podés ver todos tus turnos desde "Mis Turnos".</p>
        </div>
        <div class="flex gap-4">
          <i class="ph-bold ph-warning" style="color:#ef4444;font-size:22px;flex-shrink:0;"></i>
          <p><strong>Urgencias:</strong> Si el cuadro es grave, no solicites turno aquí. Dirigite de inmediato a la guardia más cercana.</p>
        </div>
      `;
      document.getElementById('modal-container').style.display = "flex";
    }

    function cerrarModal() { document.getElementById('modal-container').style.display = "none"; }
  </script>
</body>
</html>
